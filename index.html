<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guitarras Eléctricas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <header>
        <h1>🎸 Guitarras Eléctricas</h1>
        <p>Descubre nuestras guitarras favoritas</p>
    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <section class="catalogo">

            <h2>Nuestras Guitarras</h2>

            <div class="guitarras">

                <!-- PRIMERA GUITARRA -->
                <article class="guitarra">

                    <img src="img/guitarra1.jpg"
                         alt="Guitarra eléctrica número 1">

                    <h3>Guitarra Eléctrica 1</h3>

                    <p>
                        Una guitarra con un diseño elegante
                        y un sonido potente.
                    </p>

                </article>


                <!-- SEGUNDA GUITARRA -->
                <article class="guitarra">

                    <img src="img/guitarra2.jpg"
                         alt="Guitarra eléctrica número 2">

                    <h3>Guitarra Eléctrica 2</h3>

                    <p>
                        Una guitarra moderna ideal para
                        diferentes estilos musicales.
                    </p>

                </article>

            </div>

        </section>

    </main>


    <!-- PIE DE PÁGINA -->
    <footer>

        <p>© 2026 - Guitarras Eléctricas 🎸</p>

    </footer>

</body>

</html>
